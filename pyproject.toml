[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "distiller"
version = "0.1.0"
description = "Autoregressive DFM-Mimir fine-tuning for normalized span extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "protobuf>=5.29.0",
    "lightning>=2.6.5",
    "optuna>=4.9.0",
    "hydra-core==1.4.0.dev8",
    "omegaconf==2.4.0.dev15",
    "pyyaml>=6.0.0",
    "polars>=1.43.2",
    "fastexcel>=0.21.0",
    "numpy>=2.5.1",
    "accelerate>=1.14.0",
    "wandb>=0.20.0",
    "causal-conv1d @ git+https://github.com/Dao-AILab/causal-conv1d.git",
    "mamba-ssm @ git+https://github.com/state-spaces/mamba.git",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
no-build-isolation-package = ["mamba-ssm", "causal-conv1d"]

# Add this section to provide torch during the build phase
[tool.uv.extra-build-dependencies]
mamba-ssm = ["torch"]
causal-conv1d = ["torch"]
