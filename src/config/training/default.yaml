# Hydra config group: training
# Override via: python src/train.py training.learning_rate=5.0e-5

learning_rate: 0.0006883131060211034
weight_decay: 0.0065705784047657085
warmup_ratio: 0.06095744496605359
lr_scheduler: cosine
max_grad_norm: 1.0

# batch_size tuned by Optuna (only 64 was in its search space) — also
# matches this session's own memory-tuning work for the JAX path.
batch_size: 64
eval_batch_multiplier: 1
gradient_accumulation_steps: 2
num_train_epochs: 3

logging_steps: 10

output_dir: outputs
seed: 42
