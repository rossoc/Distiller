# Hydra config for Distiller — autoregressive DFM-Mimir fine-tuning
# Inspired by /home/local/4BC/NEM/pyproject.toml style
#
# Config groups (src/config/<group>/default.yaml) handle:
#   data, model, training, optuna, predict
# This file only wires them together + the Trainer instantiation.

defaults:
  - data: default
  - model: default
  - training: default
  - optuna: default
  - predict: default
  - wandb: default
  - runtime: default
  - _self_

# Lightning Trainer instantiation config.
# Hydra will instantiate this as a pl.Trainer.
trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: ${training.num_train_epochs}
  gradient_clip_val: ${training.max_grad_norm}
  accumulate_grad_batches: ${training.gradient_accumulation_steps}
  enable_checkpointing: true
  default_root_dir: ${training.output_dir}
  deterministic: false
  benchmark: true
  devices: auto
  accelerator: auto
  precision: bf16-true
  log_every_n_steps: ${training.logging_steps}
  check_val_every_n_epoch: null
  val_check_interval: null
